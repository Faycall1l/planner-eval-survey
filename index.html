<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Agent Planning Evaluation Corpus</title>
<style>
:root {
--primary: #2563eb;
--primary-dark: #1d4ed8;
--bg: #ffffff;
--bg-alt: #f8fafc;
--border: #e2e8f0;
--text: #1e293b;
--text-muted: #64748b;
--success: #16a34a;
--warning: #ca8a04;
--radius: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
background: var(--bg-alt);
color: var(--text);
line-height: 1.5;
}
.header {
background: var(--bg);
border-bottom: 1px solid var(--border);
padding: 24px 0;
}
.header-content {
max-width: 1280px;
margin: 0 auto;
padding: 0 24px;
}
.header h1 {
font-size: 1.5rem;
font-weight: 600;
color: var(--text);
margin-bottom: 4px;
}
.header p {
color: var(--text-muted);
font-size: 0.875rem;
}
.container {
max-width: 1280px;
margin: 0 auto;
padding: 24px;
}
.toolbar {
background: var(--bg);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 16px;
margin-bottom: 16px;
display: flex;
flex-wrap: wrap;
gap: 12px;
align-items: center;
}
.search-box {
flex: 1;
min-width: 280px;
position: relative;
}
.search-box input {
width: 100%;
padding: 10px 12px 10px 36px;
border: 1px solid var(--border);
border-radius: var(--radius);
font-size: 0.875rem;
transition: border-color 0.15s;
}
.search-box input:focus {
outline: none;
border-color: var(--primary);
box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.search-box::before {
content: "Search";
position: absolute;
left: 12px;
top: 50%;
transform: translateY(-50%);
color: var(--text-muted);
font-size: 0.875rem;
pointer-events: none;
}
select {
padding: 10px 12px;
border: 1px solid var(--border);
border-radius: var(--radius);
font-size: 0.875rem;
background: var(--bg);
cursor: pointer;
}
select:focus {
outline: none;
border-color: var(--primary);
}
.btn {
padding: 10px 16px;
border: 1px solid var(--border);
border-radius: var(--radius);
background: var(--bg);
font-size: 0.875rem;
cursor: pointer;
transition: all 0.15s;
}
.btn:hover {
background: var(--bg-alt);
}
.btn-primary {
background: var(--primary);
color: white;
border-color: var(--primary);
}
.btn-primary:hover {
background: var(--primary-dark);
}
.stats-bar {
display: flex;
gap: 16px;
margin-bottom: 16px;
flex-wrap: wrap;
}
.stat {
background: var(--bg);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 12px 16px;
flex: 1;
min-width: 140px;
}
.stat-value {
font-size: 1.5rem;
font-weight: 600;
color: var(--primary);
}
.stat-label {
font-size: 0.75rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
}
.table-container {
background: var(--bg);
border: 1px solid var(--border);
border-radius: var(--radius);
overflow: hidden;
}
table {
width: 100%;
border-collapse: collapse;
font-size: 0.875rem;
}
thead {
background: var(--bg-alt);
}
th {
padding: 12px 16px;
text-align: left;
font-weight: 600;
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-muted);
border-bottom: 1px solid var(--border);
cursor: pointer;
user-select: none;
}
th:hover {
color: var(--text);
}
td {
padding: 12px 16px;
border-bottom: 1px solid var(--border);
vertical-align: top;
}
tr:last-child td {
border-bottom: none;
}
tbody tr {
cursor: pointer;
transition: background 0.1s;
}
tbody tr:hover {
background: var(--bg-alt);
}
.class-tag {
display: inline-block;
padding: 2px 8px;
border-radius: 4px;
font-size: 0.75rem;
font-weight: 500;
}
.c1 { background: #dbeafe; color: #1e40af; }
.c2 { background: #f3e8ff; color: #6b21a8; }
.c3 { background: #dcfce7; color: #166534; }
.c4 { background: #fef3c7; color: #92400e; }
.c5 { background: #fce7f3; color: #9d174d; }
.c6 { background: #cffafe; color: #155e75; }
.venue-tag {
font-size: 0.75rem;
color: var(--text-muted);
}
.year-tag {
font-weight: 500;
}
.modal-overlay {
display: none;
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.5);
z-index: 1000;
align-items: center;
justify-content: center;
padding: 24px;
}
.modal-overlay.active {
display: flex;
}
.modal {
background: var(--bg);
border-radius: 8px;
max-width: 720px;
width: 100%;
max-height: 85vh;
overflow-y: auto;
box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}
.modal-header {
padding: 20px 24px;
border-bottom: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: flex-start;
}
.modal-header h2 {
font-size: 1.25rem;
font-weight: 600;
}
.modal-close {
background: none;
border: none;
font-size: 1.5rem;
cursor: pointer;
color: var(--text-muted);
line-height: 1;
}
.modal-close:hover {
color: var(--text);
}
.modal-body {
padding: 24px;
}
.detail-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
margin-bottom: 20px;
}
.detail-item {
background: var(--bg-alt);
padding: 12px;
border-radius: var(--radius);
}
.detail-item-label {
font-size: 0.75rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 4px;
}
.detail-item-value {
font-size: 0.875rem;
font-weight: 500;
}
.finding-box {
background: var(--bg-alt);
padding: 16px;
border-radius: var(--radius);
border-left: 3px solid var(--primary);
}
.finding-box h4 {
font-size: 0.75rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 8px;
}
.finding-box p {
font-size: 0.875rem;
line-height: 1.6;
}
.no-results {
text-align: center;
padding: 48px 24px;
color: var(--text-muted);
}
@media (max-width: 768px) {
.toolbar { flex-direction: column; }
.search-box { min-width: 100%; }
.detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="header">
<div class="header-content">
<h1>Multi-Agent Planning Evaluation Corpus</h1>
<p>128 systems from a systematic survey of LLM-based multi-agent planning evaluation (2023-2026)</p>
</div>
</div>
<div class="container">
<div class="stats-bar" id="statsBar"></div>
<div class="toolbar">
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search papers, benchmarks, findings...">
</div>
<select id="classSelect">
<option value="">All Classes</option>
<option value="1">Class 1: Formal Plan Validity</option>
<option value="2">Class 2: Decomposition and Tool Orchestration</option>
<option value="3">Class 3: Embodied and Interactive Execution</option>
<option value="4">Class 4: Robustness and Recovery</option>
<option value="5">Class 5: Efficiency and Cost</option>
<option value="6">Class 6: Coordination Structure</option>
</select>
<select id="yearSelect">
<option value="">All Years</option>
<option value="2023">2023</option>
<option value="2024">2024</option>
<option value="2025">2025</option>
<option value="2026">2026</option>
</select>
<select id="venueSelect">
<option value="">All Venues</option>
<option value="peer">Peer-reviewed</option>
<option value="preprint">Preprint</option>
</select>
<button class="btn" onclick="resetFilters()">Reset</button>
</div>
<div class="table-container">
<table>
<thead>
<tr>
<th onclick="sortTable('name')">Paper</th>
<th onclick="sortTable('cls')">Class</th>
<th onclick="sortTable('year')">Year</th>
<th onclick="sortTable('venue')">Venue</th>
<th>Benchmarks</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<div class="modal-header">
<h2 id="modalTitle"></h2>
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-body" id="modalBody"></div>
</div>
</div>
<script>
let papers = [];
let currentSort = { key: 'year', dir: 'desc' };

fetch('data.json')
.then(r => r.json())
.then(data => {
papers = data;
renderStats();
renderTable(papers);
});

function renderStats() {
const el = document.getElementById('statsBar');
const peer = papers.filter(p => p.venue && !p.venue.toLowerCase().includes('arxiv')).length;
const preprints = papers.length - peer;
el.innerHTML = `
<div class="stat"><div class="stat-value">${papers.length}</div><div class="stat-label">Papers</div></div>
<div class="stat"><div class="stat-value">${peer}</div><div class="stat-label">Peer-reviewed</div></div>
<div class="stat"><div class="stat-value">${preprints}</div><div class="stat-label">Preprints</div></div>
<div class="stat"><div class="stat-value">${new Set(papers.map(p => p.year)).size}</div><div class="stat-label">Years</div></div>
`;
}

function renderTable(data) {
const tbody = document.getElementById('tableBody');
if (data.length === 0) {
tbody.innerHTML = '<tr><td colspan="5"><div class="no-results">No papers match the current filters.</div></td></tr>';
return;
}
tbody.innerHTML = data.map(p => `
<tr onclick="showDetail('${p.pid}')">
<td><strong>${escHtml(p.name)}</strong></td>
<td><span class="class-tag c${p.cls}">C${p.cls}</span></td>
<td class="year-tag">${p.year}</td>
<td class="venue-tag">${escHtml(p.venue || 'Preprint')}</td>
<td>${escHtml(p.benchmarks ? p.benchmarks.split(';')[0] : 'N/A')}</td>
</tr>
`).join('');
}

function escHtml(s) {
const d = document.createElement('div');
d.textContent = s || '';
return d.innerHTML;
}

function showDetail(pid) {
const p = papers.find(x => x.pid === pid);
if (!p) return;
document.getElementById('modalTitle').textContent = p.name;
const className = {
'1': 'Formal Plan Validity',
'2': 'Decomposition and Tool Orchestration',
'3': 'Embodied and Interactive Execution',
'4': 'Robustness and Recovery',
'5': 'Efficiency and Cost',
'6': 'Coordination Structure'
}[p.cls] || 'Unknown';
document.getElementById('modalBody').innerHTML = `
<div class="detail-grid">
<div class="detail-item"><div class="detail-item-label">Class</div><div class="detail-item-value">Class ${p.cls}: ${className}</div></div>
<div class="detail-item"><div class="detail-item-label">Year</div><div class="detail-item-value">${p.year}</div></div>
<div class="detail-item"><div class="detail-item-label">Venue</div><div class="detail-item-value">${escHtml(p.venue || 'Preprint')}</div></div>
<div class="detail-item"><div class="detail-item-label">Benchmarks</div><div class="detail-item-value">${escHtml(p.benchmarks || 'N/A')}</div></div>
<div class="detail-item"><div class="detail-item-label">Repeat Runs</div><div class="detail-item-value">${p.runs}</div></div>
<div class="detail-item"><div class="detail-item-label">Seeds</div><div class="detail-item-value">${p.seeds}</div></div>
<div class="detail-item"><div class="detail-item-label">Prompts</div><div class="detail-item-value">${p.prompts}</div></div>
<div class="detail-item"><div class="detail-item-label">Code</div><div class="detail-item-value">${p.code}</div></div>
<div class="detail-item"><div class="detail-item-label">Dated Model</div><div class="detail-item-value">${p.modelver}</div></div>
<div class="detail-item"><div class="detail-item-label">Coordination Metric</div><div class="detail-item-value">${p.coord_metric}</div></div>
</div>
<div class="finding-box">
<h4>Key Finding</h4>
<p>${escHtml(p.finding || 'N/A')}</p>
</div>
`;
document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(e) {
if (!e || e.target.id === 'modalOverlay') {
document.getElementById('modalOverlay').classList.remove('active');
}
}

function filterPapers() {
const q = document.getElementById('searchInput').value.toLowerCase();
const cls = document.getElementById('classSelect').value;
const year = document.getElementById('yearSelect').value;
const venue = document.getElementById('venueSelect').value;
let filtered = papers.filter(p => {
if (cls && p.cls !== cls) return false;
if (year && p.year !== year) return false;
if (venue === 'peer' && (!p.venue || p.venue.toLowerCase().includes('arxiv'))) return false;
if (venue === 'preprint' && p.venue && !p.venue.toLowerCase().includes('arxiv')) return false;
if (q) {
const text = (p.name + ' ' + (p.benchmarks || '') + ' ' + (p.finding || '')).toLowerCase();
if (!text.includes(q)) return false;
}
return true;
});
filtered = sortData(filtered);
renderTable(filtered);
}

function sortData(data) {
const { key, dir } = currentSort;
return [...data].sort((a, b) => {
let va = a[key], vb = b[key];
if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
if (va < vb) return dir === 'asc' ? -1 : 1;
if (va > vb) return dir === 'asc' ? 1 : -1;
return 0;
});
}

function sortTable(key) {
if (currentSort.key === key) {
currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
} else {
currentSort = { key, dir: 'asc' };
}
filterPapers();
}

function resetFilters() {
document.getElementById('searchInput').value = '';
document.getElementById('classSelect').value = '';
document.getElementById('yearSelect').value = '';
document.getElementById('venueSelect').value = '';
filterPapers();
}

document.getElementById('searchInput').addEventListener('input', filterPapers);
document.getElementById('classSelect').addEventListener('change', filterPapers);
document.getElementById('yearSelect').addEventListener('change', filterPapers);
document.getElementById('venueSelect').addEventListener('change', filterPapers);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
